[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostworkflow"
version = "0.1.0"
description = "End-to-end workflow orchestrator for the Ghost ecosystem: GhostSlice -> GhostVerify -> GhostBench -> GhostConsole board, with an evidence report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "workflow", "agents"]
dependencies = []

[project.scripts]
ghostworkflow = "ghostworkflow.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
